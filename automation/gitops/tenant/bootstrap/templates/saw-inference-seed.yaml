{{- $saw := .Values.saw | default dict -}}
{{- $seed := $saw.inferenceSeed | default dict -}}
{{- if and (or (not (hasKey $saw "enabled")) (eq (lower (toString $saw.enabled)) "true")) (eq (lower (toString $seed.enabled)) "true") }}
{{- $name := required "saw.userName is required" $saw.userName -}}
{{- if not (regexMatch "^[a-z]([-a-z0-9]*[a-z0-9])?$" $name) }}
{{- fail "saw.userName must be a lowercase DNS label" }}
{{- end }}
{{- $data := $seed.secretData | default dict -}}
{{- $url := urlParse (required "saw.inferenceSeed.secretData.url is required" $data.url) -}}
{{- $host := required "saw.inferenceHost is required" $saw.inferenceHost -}}
{{- $_ := required "saw.inferenceSeed.secretData.api_key is required" $data.api_key -}}
{{- $_ := required "saw.inferenceSeed.secretData.model is required" $data.model -}}
{{- if or (ne $url.scheme "https") (ne (lower (trimSuffix ":443" $url.host)) (lower $host)) $url.userinfo $url.query $url.fragment }}
{{- fail "saw inference URL must be HTTPS on port 443 and match saw.inferenceHost" }}
{{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ printf "saw-%s-inference-input" $name | quote }}
  namespace: vault
type: Opaque
stringData:
  api_key: {{ $data.api_key | quote }}
  provider: custom-inference
  model: {{ $data.model | quote }}
  url: {{ $data.url | quote }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ printf "saw-%s-inference-seed" $name | quote }}
  namespace: vault
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 20
  template:
    spec:
      restartPolicy: OnFailure
      securityContext: {runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: seed
          image: registry.access.redhat.com/ubi9/python-311@sha256:a0bdb55576fc5b8d6704279307817828ef027e1065533ceba133fe9516003a6c
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
          env:
            - {name: VAULT_PATH, value: {{ printf "hub/saw-%s/inference" $name | quote }}}
          command: [python, -c]
          args:
            - |
              import json, os, pathlib, ssl, urllib.request
              source = pathlib.Path('/input')
              token = pathlib.Path('/vault-token/token').read_text().strip()
              data = {name: (source / name).read_text().rstrip('\r\n') for name in ('api_key', 'provider', 'model', 'url')}
              if not all(data.values()):
                  raise SystemExit('Inference source Secret is incomplete')
              request = urllib.request.Request('https://vault.vault.svc:8200/v1/secret/data/' + os.environ['VAULT_PATH'], data=json.dumps({'data': data}).encode(), headers={'X-Vault-Token': token, 'Content-Type': 'application/json'}, method='POST')
              with urllib.request.urlopen(request, context=ssl.create_default_context(cafile='/ca/service-ca.crt'), timeout=30) as response:
                  print('Tenant inference secret written to Vault:', response.status)
          volumeMounts:
            - {name: inference, mountPath: /input, readOnly: true}
            - {name: token, mountPath: /vault-token, readOnly: true}
            - {name: ca, mountPath: /ca, readOnly: true}
      volumes:
        - name: inference
          secret: {secretName: {{ printf "saw-%s-inference-input" $name | quote }}}
        - name: token
          secret: {secretName: {{ $seed.vaultTokenSecret | default "saw-vault-writer" | quote }}, items: [{key: token, path: token}]}
        - name: ca
          configMap: {name: saw-vault-service-ca}
{{- end }}
