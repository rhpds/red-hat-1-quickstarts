apiVersion: saw.redhat.com/v1alpha1
kind: HarnessBundle
metadata:
  name: demo-assistant
spec:
  agent: openclaw
  version: 0.1.0
  plugins: []
  mcpServers:
    - name: mailpit_reader
      governanceProfile: mailpit
    - name: mattermost_reader
      governanceProfile: mattermost
    - name: calendar_reader
      governanceProfile: calendar
    - name: demo_notes
  toolAllowlist:
    - mailpit_reader__saw_read_email
    - mattermost_reader__saw_read_chat
    - calendar_reader__saw_read_calendar
    - demo_notes__saw_save_report
    - demo_notes__saw_upload_summary
