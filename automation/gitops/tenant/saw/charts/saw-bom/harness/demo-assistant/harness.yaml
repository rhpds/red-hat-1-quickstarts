apiVersion: saw.redhat.com/v1alpha1
kind: HarnessBundle
metadata:
  name: demo-assistant
spec:
  agent: openclaw
  version: 0.1.0
  plugins: []
  mcpServers:
    - name: mailpit-reader
      governanceProfile: mailpit
    - name: mattermost-reader
      governanceProfile: mattermost
    - name: calendar-reader
      governanceProfile: calendar
    - name: demo-notes
  toolAllowlist:
    - mailpit-reader__saw_read_email
    - mattermost-reader__saw_read_chat
    - calendar-reader__saw_read_calendar
    - demo-notes__saw_save_report
    - demo-notes__saw_upload_summary
