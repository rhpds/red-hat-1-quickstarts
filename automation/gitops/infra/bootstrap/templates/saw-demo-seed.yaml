{{- $saw := .Values.saw }}
{{- $demo := $saw.demo | default dict }}
{{- if and (eq (lower (toString $saw.enabled)) "true") (eq (lower (toString $demo.enabled)) "true") (eq (lower (toString $demo.provisioningEnabled)) "true") }}
{{- if ne (lower (toString $demo.calendarEnabled)) "true" }}{{ fail "saw.demo.calendarEnabled is required for demo setup" }}{{ end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: saw-demo-seed
  namespace: vault
data:
  seed-demo.py: |
{{ .Files.Get "files/seed-demo.py" | indent 4 }}
  demo-data.json: |
{{ .Files.Get "files/demo-data.json" | indent 4 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: saw-demo-vault-ca
  namespace: vault
  annotations:
    service.beta.openshift.io/inject-cabundle: "true"
data: {}
---
apiVersion: v1
kind: Secret
metadata:
  name: saw-demo-state
  namespace: vault
# The setup script owns the generated administrator and demo session state.
type: Opaque
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: saw-demo-seed
  namespace: vault
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: saw-demo-seed
  namespace: vault
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [saw-demo-state]
    verbs: [get, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: saw-demo-seed
  namespace: vault
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: saw-demo-seed}
subjects:
  - {kind: ServiceAccount, name: saw-demo-seed, namespace: vault}
---
# Migration from the older per-tenant demo: adopt its existing administrator.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: saw-demo-seed-migrate
  namespace: openshell-agents
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [saw-demo-admin]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: saw-demo-seed-migrate
  namespace: openshell-agents
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: saw-demo-seed-migrate}
subjects:
  - {kind: ServiceAccount, name: saw-demo-seed, namespace: vault}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: saw-demo-seed
  namespace: vault
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 20
  template:
    metadata:
      labels: {saw-demo-seed: "true"}
    spec:
      restartPolicy: OnFailure
      serviceAccountName: saw-demo-seed
      securityContext: {runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: seed
          image: registry.access.redhat.com/ubi9/python-311@sha256:a0bdb55576fc5b8d6704279307817828ef027e1065533ceba133fe9516003a6c
          command: [python, /scripts/seed-demo.py, seed, --in-cluster]
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
          volumeMounts:
            - {name: scripts, mountPath: /scripts, readOnly: true}
            - {name: password, mountPath: /input, readOnly: true}
            - {name: work, mountPath: /work}
            - {name: token, mountPath: /vault-token, readOnly: true}
            - {name: ca, mountPath: /ca, readOnly: true}
      volumes:
        - name: scripts
          configMap: {name: saw-demo-seed}
        - name: password
          secret: {secretName: {{ $demo.passwordSecret | default "saw-demo-password" | quote }}, items: [{key: password, path: password}]}
        - name: work
          emptyDir: {}
        - name: token
          secret: {secretName: {{ $demo.vaultTokenSecret | default "saw-vault-writer" | quote }}, items: [{key: token, path: token}]}
        - name: ca
          configMap: {name: saw-demo-vault-ca}
{{- range $service := list "mailpit" "radicale" }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: saw-demo-{{ $service }}-backend
  namespace: openshell-agents
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: {{ $service }}}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {policy-group.network.openshift.io/ingress: ""}
        - namespaceSelector:
            matchLabels: {policy-group.network.openshift.io/host-network: ""}
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: vault}
          podSelector:
            matchLabels: {saw-demo-seed: "true"}
      ports: [{protocol: TCP, port: {{ ternary 8025 5232 (eq $service "mailpit") }}}]
{{- end }}
{{- end }}
