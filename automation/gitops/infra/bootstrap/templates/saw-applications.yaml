{{- if eq (lower (toString .Values.saw.enabled)) "true" }}
{{- $saw := .Values.saw -}}
{{- $domain := required "saw.clusterDomain is required (without the apps. prefix)" $saw.clusterDomain -}}
{{- $password := required "saw.keycloak.postgresPassword is required" $saw.keycloak.postgresPassword -}}
{{- $vaultDefaults := dict "global" (dict "localClusterDomain" (printf "apps.%s" $domain)) "vault" (dict "server" (dict "image" (dict "tag" "2.1.2-ubi@sha256:b46738fbe5494e4141e94a0641e4e676e090af788b7729d8b3af2b62cadf5aef"))) -}}
{{- $esoConnection := fromYaml `
vault:
  externalAddress: https://vault.vault.svc:8200
  external:
    kubernetesMountPath: hub
    kubernetesRole: hub-role
    secretRef:
      name: ocp-external-secrets
      namespace: external-secrets
      key: token
caProvider:
  hostCluster:
    type: ConfigMap
    name: saw-vault-service-ca
    namespace: external-secrets
    key: service-ca.crt
` -}}
{{- $esoDefaults := dict "ocpExternalSecrets" $esoConnection "global" (dict "clusterDomain" $domain "hubClusterDomain" (printf "apps.%s" $domain)) "clusterGroup" (dict "applications" (dict "vault" (dict "chart" "hashicorp-vault"))) -}}
{{- $keycloakDefaults := dict "postgres" (dict "password" $password) "keycloak" (dict "hostname" (printf "https://openshell-keycloak-ingress-saw-keycloak.apps.%s" $domain) "userPasswords" (dict "externalSecret" (dict "enabled" true))) "ownerResolver" (dict "enabled" true) -}}
{{- $portal := $saw.portal | default dict -}}
{{- $portalDefaults := dict
  "global" (dict "repoURL" $saw.git.url "targetRevision" $saw.git.revision "clusterDomain" $domain "vpArgoNamespace" $saw.gitopsNamespace)
  "rhdh" (dict "namespace" ($portal.namespace | default "rhdh"))
  "keycloak" (dict "namespace" "saw-keycloak" "name" "openshell-keycloak" "realm" "openshell") -}}
{{- $apps := list
  (dict "name" "saw-vault" "release" "vault" "namespace" "vault" "path" "automation/gitops/infra/saw/vault" "wave" "0" "values" (mustMergeOverwrite $vaultDefaults (deepCopy $saw.vault.values)))
  (dict "name" "saw-external-secrets" "namespace" "external-secrets" "path" "automation/gitops/infra/saw/external-secrets" "wave" "0" "values" (mustMergeOverwrite $esoDefaults (deepCopy $saw.externalSecrets.values)))
  (dict "name" "saw-virtualization" "namespace" "openshift-cnv" "path" "automation/gitops/tenant/saw/charts/openshift-cnv" "wave" "0" "values" dict)
  (dict "name" "saw-keycloak" "namespace" "saw-keycloak" "path" "automation/gitops/tenant/saw/charts/openshell-keycloak" "wave" "0" "values" (mustMergeOverwrite $keycloakDefaults (deepCopy $saw.keycloak.values)))
  (dict "name" "saw-governance-policy" "namespace" "openshell-agents" "path" "automation/gitops/tenant/saw/charts/governance-policy" "wave" "0" "values" dict)
  (dict "name" "saw-governance-interceptor" "namespace" "openshell-agents" "path" "automation/gitops/tenant/saw/charts/governance-interceptor" "wave" "0" "values" $saw.governance.values) -}}
{{- if eq (lower (toString ($portal.enabled | default false))) "true" -}}
{{- $apps = append $apps (dict "name" "saw-rhdh" "namespace" ($portal.namespace | default "rhdh") "path" "automation/gitops/tenant/saw/charts/openshell-rhdh" "wave" "2" "values" (mustMergeOverwrite $portalDefaults (deepCopy ($portal.values | default dict)))) -}}
{{- end -}}
{{- range $app := $apps }}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ $app.name }}
  namespace: {{ $saw.gitopsNamespace | quote }}
  annotations:
    argocd.argoproj.io/sync-wave: {{ $app.wave | quote }}
spec:
  project: default
  source:
    repoURL: {{ $saw.git.url | quote }}
    targetRevision: {{ $saw.git.revision | quote }}
    path: {{ $app.path }}
    helm:
      releaseName: {{ $app.release | default $app.name }}
      values: |
{{ toYaml $app.values | indent 8 }}
  destination:
    server: https://kubernetes.default.svc
    namespace: {{ $app.namespace }}
  syncPolicy:
    automated:
      prune: false
      selfHeal: false
    syncOptions:
      - CreateNamespace=true
      - SkipDryRunOnMissingResource=true
    retry:
      limit: 30
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 5m
{{- end }}
{{- end }}
