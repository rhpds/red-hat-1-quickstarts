{{- $demo := .Values.saw.demo | default dict }}
{{- if and (eq (lower (toString .Values.saw.enabled)) "true") (or .Values.saw.governance.customInference.host (eq (lower (toString $demo.enabled)) "true")) }}
{{- $config := .Values.saw.governance.customInference }}
{{- if $config.host }}
{{- if not (regexMatch "^[a-zA-Z0-9]([a-zA-Z0-9.-]*[a-zA-Z0-9])?$" $config.host) }}
{{- fail "saw.governance.customInference.host must be a hostname without a scheme, port, or wildcard" }}
{{- end }}
{{- if or (lt (int $config.port) 1) (gt (int $config.port) 65535) }}
{{- fail "saw.governance.customInference.port must be between 1 and 65535" }}
{{- end }}
{{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: governance-interceptor-extra-profiles
  namespace: openshell-agents
data:
{{- if $config.host }}
  custom-inference.yaml: |
{{- $profile := .Files.Get "files/custom-inference.yaml" | fromYaml }}
{{- $_ := set (index $profile.endpoints 0) "host" $config.host }}
{{- $_ := set (index $profile.endpoints 0) "port" (int $config.port) }}
{{ toYaml $profile | indent 4 }}
{{- end }}
{{- if eq (lower (toString $demo.enabled)) "true" }}
{{- $names := list "mailpit" "mattermost" }}
{{- if eq (lower (toString $demo.calendarEnabled)) "true" }}
{{- $names = append $names "calendar" }}
{{- end }}
{{- range $name := $names }}
  {{ $name }}.yaml: |
{{- $profile := $.Files.Get (printf "files/demo/%s.yaml" $name) | replace "CLUSTER_DOMAIN" (required "saw.clusterDomain is required for demo HTTPS endpoints" $.Values.saw.clusterDomain) | fromYaml }}
{{ toYaml $profile | indent 4 }}
{{- end }}
{{- end }}
{{- end }}
