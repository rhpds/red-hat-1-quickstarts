{{- if eq (lower (toString .Values.saw.enabled)) "true" }}
{{- $saw := .Values.saw }}
{{- $namespaces := list "external-secrets-operator" "external-secrets" "openshift-cnv" "saw-keycloak" "openshell-agents" "vault" -}}
{{- if eq (lower (toString (($saw.portal | default dict).enabled | default false))) "true" }}
{{- $namespaces = append $namespaces (($saw.portal | default dict).operatorNamespace | default "rhdh-operator") -}}
{{- $namespaces = append $namespaces (($saw.portal | default dict).pipelinesNamespace | default "openshift-pipelines") -}}
{{- end }}
{{- range $name := $namespaces }}
---
apiVersion: v1
kind: Namespace
metadata:
  name: {{ $name }}
  labels:
    argocd.argoproj.io/managed-by: {{ $saw.gitopsNamespace | quote }}
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
{{- end }}
{{- $operators := list
  (dict "namespace" "external-secrets-operator" "name" "openshift-external-secrets-operator" "channel" $saw.operators.externalSecretsChannel "allNamespaces" true)
  (dict "namespace" "openshift-cnv" "name" "kubevirt-hyperconverged" "channel" $saw.operators.virtualizationChannel)
  (dict "namespace" "saw-keycloak" "name" "rhbk-operator" "channel" $saw.operators.keycloakChannel) }}
{{- if eq (lower (toString (($saw.portal | default dict).enabled | default false))) "true" }}
{{- $operators = append $operators (dict "namespace" (($saw.portal | default dict).operatorNamespace | default "rhdh-operator") "name" "rhdh" "channel" (($saw.portal | default dict).operatorChannel | default "fast-1.10") "allNamespaces" true) }}
{{- $operators = append $operators (dict "namespace" (($saw.portal | default dict).pipelinesNamespace | default "openshift-pipelines") "name" "openshift-pipelines-operator-rh" "channel" (($saw.portal | default dict).pipelinesChannel | default "pipelines-1.24") "allNamespaces" true) }}
{{- end }}
{{- range $operator := $operators }}
---
apiVersion: operators.coreos.com/v1
kind: OperatorGroup
metadata:
  name: {{ $operator.namespace }}
  namespace: {{ $operator.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  {{- if not $operator.allNamespaces }}
  targetNamespaces:
    - {{ $operator.namespace }}
  {{- end }}
---
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: {{ $operator.name }}
  namespace: {{ $operator.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  channel: {{ $operator.channel | quote }}
  installPlanApproval: Automatic
  name: {{ $operator.name }}
  source: {{ $saw.operators.source | quote }}
  sourceNamespace: {{ $saw.operators.sourceNamespace | quote }}
{{- end }}
{{- end }}
