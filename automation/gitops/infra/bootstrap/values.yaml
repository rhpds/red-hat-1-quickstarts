# The bootstrap Application also owns the operational tuning for the OpenShift
# GitOps instance it relies on. The repo-server fetches this repository over the
# cluster egress path; keep its Git command timeout and the application
# controller RPC timeout aligned.
gitops:
  argocd:
    name: openshift-gitops
    repo:
      execTimeout: 300
    controller:
      repoServerTimeoutSeconds: 300
      resources:
        requests:
          cpu: 500m
          memory: 2Gi
        limits:
          cpu: 2
          memory: 4Gi
      processors:
        operation: 3
        status: 5

# SAW is opt-in so existing clusters do not receive new operators implicitly.
saw:
  enabled: false
  git:
    url: https://github.com/rhpds/red-hat-1-quickstarts.git
    revision: main
  gitopsNamespace: openshift-gitops
  clusterDomain: ""
  # Shared synthetic demo services in openshell-agents. Enable all three
  # flags for authenticated, automatically populated tenant sources.
  demo:
    enabled: false
    calendarEnabled: false
    provisioningEnabled: false
    oidcIssuer: ""
  keycloak:
    postgresPassword: ""
    values: {}
  vault:
    values: {}
  externalSecrets:
    values: {}
  inferenceSeed:
    enabled: false
    sourceSecret: saw-inference
    # Prefer a pre-created Kubernetes Secret. If set, these values are rendered
    # into a Secret and are also visible in the Argo CD Application spec.
    secretData: {}
    vaultTokenSecret: saw-vault-writer
    vaultTokenKey: token
    vaultPath: hub/inference
  governance:
    values: {}
    customInference:
      host: ""
      port: 443
  operators:
    source: redhat-operators
    sourceNamespace: openshift-marketplace
    externalSecretsChannel: stable-v1
    virtualizationChannel: stable
    keycloakChannel: stable-v26
