---
# SETUP — module 2: AI Quickstart RAG — Running the Demo
#
# Runs when the learner opens the module (GET /stream/setup/module-02).
# Read-only: waits until the tenant's RAG stack can be used, so a broken
# environment fails here with an actionable message instead of in front of the
# learner. Must stay idempotent — it runs on every page load.

- name: Wait for the module 2 RAG stack
  hosts: localhost
  connection: local
  gather_facts: false
  module_defaults:
    group/kubernetes.core.k8s:
      kubeconfig: "{{ k8s_kubeconfig | default(omit) }}"
  vars:
    tenant_guid: "{{ guid | default(lookup('env', 'GUID'), true) }}"
    user_data: >-
      {{
        (lookup('file', '/user_data/user_data.yml', errors='ignore') | default('', true) | from_yaml)
        or {}
      }}
    domain: "{{ user_data.openshift_cluster_ingress_domain | default(lookup('env', 'DOMAIN'), true) }}"
    tenant_user: "{{ student_user | default(user_data.user | default('user-' ~ tenant_guid)) }}"
    rag_ns: "{{ tenant_user }}-rag"
    # Route name is the Argo CD application name plus "-rag".
    rag_url: "https://tenant-{{ tenant_guid }}-rag-{{ rag_ns }}.{{ domain }}"
  tasks:
    - name: The RAG Argo CD application is Synced and Healthy
      kubernetes.core.k8s_info:
        api_version: argoproj.io/v1alpha1
        kind: Application
        namespace: openshift-gitops
        name: "tenant-{{ tenant_guid }}"
      register: r_app
      changed_when: false
      retries: 60
      delay: 10
      until: >-
        r_app.resources | default([]) | length > 0 and
        r_app.resources[0].status.sync.status == 'Synced' and
        r_app.resources[0].status.health.status == 'Healthy'
      failed_when: >-
        r_app.resources | default([]) | length == 0 or
        r_app.resources[0].status.health.status != 'Healthy'

    - name: The RAG UI answers
      ansible.builtin.uri:
        url: "{{ rag_url }}"
        method: GET
        status_code: [200, 302, 303, 307]
        follow_redirects: none
        validate_certs: false
        timeout: 15
      register: r_route
      changed_when: false
      retries: 12
      delay: 10
      until: r_route.status | default(0) in [200, 302, 303, 307]
      failed_when: r_route.status | default(0) not in [200, 302, 303, 307]

    - name: Ready for module 2
      ansible.builtin.debug:
        msg: "RAG UI is serving at {{ rag_url }}"
