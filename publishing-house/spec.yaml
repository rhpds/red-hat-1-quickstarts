  title: 'Selling with Red Hat QuickStarts: A Hands-On Tour for Solution Architects'
  learning_objectives:
  - Explore the Red Hat QuickStarts catalog and identify how QuickStarts accelerate
    customer proofs-of-concept
  - Demonstrate the AI Quickstart RAG to a customer audience using a pre-deployed
    instance
  - Demonstrate the AI Quickstart IT Self Service to a customer audience using a pre-deployed
    instance
  - Demonstrate the AI Quickstart PPE Compliance Monitor to a customer audience using
    a pre-deployed instance
  - Analyze the broader QuickStart family to match customer use cases to the right
    QuickStart in a sales conversation
