approval_checklist:
  content:
    prerequisites_verifiable: false
    assessment_strategy: "Trust-based \u2014 no automated solve/validate checks (classic\
      \ Showroom lab). Participants complete each module's hands-on steps and can\
      \ demo the resulting QuickStart deployments live."
    catalog_gap: No existing catalog item covers the Red Hat QuickStarts catalog itself,
      the specific AI Quickstart RAG, IT Self Service, and PPE Compliance Monitor
      QuickStarts together, or positioning the QuickStart family for customer sales
      conversations. The closest match (80% relevance) only covers a RAG demo narrative
      and does not address the other two QuickStarts, catalog navigation, or sales
      positioning.
    design_overview: "This lab equips intermediate Red Hat Solution Architects to\
      \ sell with AI Quickstarts. Participants learn what a QuickStart is and how\
      \ to navigate the catalog to match customer use cases, then walk through three\
      \ pre-deployed QuickStarts \u2014 AI Quickstart RAG, AI Quickstart IT Self Service,\
      \ and AI Quickstart PPE Compliance Monitor \u2014 learning how to run and narrate\
      \ each as a customer-facing demo. An optional stretch module covers deploying\
      \ a QuickStart end-to-end for SAs with time remaining."
    module_summaries:
    - title: 'Selling with Red Hat QuickStarts: What Is a QuickStart?'
      overview: Placeholder module to be fleshed out after the flagship RAG content
        lands. Will become a presentation-style introduction to what a Red Hat QuickStart
        is, the problem it solves, and a guided tour of the QuickStarts catalog
        (docs.redhat.com/en/learn/ai-quickstarts) for matching a QuickStart to a
        customer use case.
    - title: "AI Quickstart RAG \u2014 Running the Demo"
      overview: Flagship QuickStart, part 1 of 2. Participants use an already-deployed
        AI Quickstart RAG instance via the RAG UI tab, framing the FantaCo enterprise
        use case and running the core grounded-answers demo (knowledge bases, direct
        chat with source citations). Adapted from the upstream showroom-ai-quickstart-rag
        lab, re-slanted toward sales value over technical depth.
    - title: "AI Quickstart RAG \u2014 Selling the Agentic Story"
      overview: Flagship QuickStart, part 2 of 2. Participants run the agentic RAG
        and live web-search demo (the "Super Bowl 2025" moment showing live tool
        calls vs stale training data), then practice the customer sales narrative and
        talking points that tie the demo back to Red Hat OpenShift AI.
    - title: "AI Quickstart IT Self Service \u2014 Selling the Demo"
      overview: "Planned (not yet written). Grounded on rh-ai-quickstart/it-self-service-agent
        (laptop-refresh self-service agent), adapting the existing rhpds/showroom-ai-quickstart-it-self-service-agent
        lab and its ai-qs-it-self-service-tenant AgnosticV tenant. Demo runs over a
        test-email (Greenmail) Webmail tab; must be pre-warmed and tightly scripted
        to hide 10\u201330s LLM latency, with the oc/pods page cut. Chosen over
        speeding-up-ticket-resolution for existing assets despite a weaker demo surface."
    - title: "AI Quickstart PPE Compliance Monitor \u2014 Selling the Demo"
      overview: "Planned (not yet written). Grounded on rh-ai-quickstart/multimodal-compliance-monitor,
        adapting the existing rh-ai-qs-showroom/showroom-ai-quickstart-multimodal-monitor
        lab. The most visual demo in the lab (live bounding-box detection on a seeded
        safety video + multimodal chat). Runs GPU-free on the OpenVINO/CPU profile
        (make deploy-openvino) per gpu_nodes:0; ships its own sample video/models."
    - title: Deploy a QuickStart (Optional/Stretch)
      overview: Time-permitting stretch module where participants deploy a QuickStart
        end-to-end. Specific QuickStart TBD.
