approval_checklist:
  content:
    prerequisites_verifiable: false
    assessment_strategy: "Trust-based \u2014 no automated solve/validate checks (classic\
      \ Showroom lab). Participants complete each module's hands-on steps and can\
      \ demo the resulting QuickStart deployments live."
    catalog_gap: No existing catalog item covers the Red Hat QuickStarts catalog itself,
      the specific AI Quickstart RAG, IT Self Service, and PPE Compliance Monitor
      QuickStarts together, or positioning the QuickStart family for customer sales
      conversations. The closest match (80% relevance) only covers a RAG demo narrative
      and does not address the other two QuickStarts, catalog navigation, or sales
      positioning.
    design_overview: "This lab equips intermediate Red Hat Solution Architects to\
      \ sell with AI Quickstarts. Participants learn what a QuickStart is and how\
      \ to navigate the catalog to match customer use cases, then walk through three\
      \ pre-deployed QuickStarts \u2014 AI Quickstart RAG, AI Quickstart IT Self Service,\
      \ and AI Quickstart PPE Compliance Monitor \u2014 learning how to run and narrate\
      \ each as a customer-facing demo. An optional stretch module covers deploying\
      \ a QuickStart end-to-end for SAs with time remaining."
    module_summaries:
    - title: 'Selling with Red Hat QuickStarts: What Is a QuickStart?'
      overview: Presentation-style (dealer's choice format) introduction to what a
        Red Hat QuickStart is and the problem it solves, a guided tour of the QuickStarts
        catalog and how to match a QuickStart to a customer use case, and an optional
        walkthrough of how to demo one of the lab's featured QuickStarts to a customer.
    - title: "AI Quickstart RAG \u2014 Selling the Demo"
      overview: Participants use an already-deployed AI Quickstart RAG instance, following
        a guide focused on running and narrating the demo rather than deploying it.
    - title: "AI Quickstart IT Self Service \u2014 Selling the Demo"
      overview: Participants use an already-deployed AI Quickstart IT Self Service
        instance (speeding up ticket resolution). Built by the field from closer-to-real
        customer use cases, with existing talking points and demo material to draw
        on.
    - title: "AI Quickstart PPE Compliance Monitor \u2014 Selling the Demo"
      overview: Participants use an already-deployed AI Quickstart PPE Compliance
        Monitor instance, following a guide focused on running and narrating the demo
        rather than deploying it.
    - title: Deploy a QuickStart (Optional/Stretch)
      overview: Time-permitting stretch module where participants deploy a QuickStart
        end-to-end. Specific QuickStart TBD.
    rcars_overlap_pct: 80
    rcars_top_matches:
    - title: Generative AI Demo with Red Hat Openshift AI
      ci_name: sandboxes-gpte.ocp-demo-gen-ai.prod
      url: https://catalog.demo.redhat.com/catalog?item=sandboxes-gpte.ocp-demo-gen-ai.prod
      relevance_score: 80
      why_it_fits: Covers a sales-oriented RAG demo on Red Hat OpenShift AI, closely
        aligned with the AI Quickstart RAG module, but does not cover the IT Self
        Service or PPE Compliance Monitor Quickstarts or QuickStarts catalog navigation.
    - title: Generative AI Demo with Red Hat Openshift AI (CNV Pools)
      ci_name: agd-v2.ocp-demo-gen-ai-cnv.prod
      url: https://catalog.demo.redhat.com/catalog?item=agd-v2.ocp-demo-gen-ai-cnv.prod
      relevance_score: 77
      why_it_fits: Covers the same RAG demo narrative as above on CNV pools, but likewise
        does not cover the IT Self Service or PPE Compliance Monitor Quickstarts or
        catalog navigation/sales positioning.
    - title: OpenShift Advanced App Platform Demo
      ci_name: published.ocp4-adv-app-platform-demo.prod
      url: https://catalog.demo.redhat.com/catalog?item=published.ocp4-adv-app-platform-demo.prod
