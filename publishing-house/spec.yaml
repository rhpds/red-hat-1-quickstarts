# Publishing House — Project Spec
# Lifecycle: intake → content_review → infra_review → jira_sync → development → ready → published
# No secrets in this file. Tokens live in ~/.config/publishing-house/auth.json
# Stage is managed by SonataFlow and cached in .ph-state — do not edit stage.current manually.
# NOTE: This file is also in the template repo. The Scaffolder overlays project.* values.
# TODO: Eliminate this copy — Scaffolder should pull from template repo directly.

project:
  slug: "red-hat-1-quickstarts"
  owner_email: "ankay@redhat.com"
  content_type: "lab"
  deployment_mode: "rhdp_published"
  initiative_key: "rh1_2027"
  showroom_type: "classic"
  intake_type: "new"
  description: "Hands-on Red Hat One lab using two new QuickStarts and an overview of the other QuickStarts designed to enable SAs to use QuickStarts to sell OpenShift AI and related products, and shorten the sales cycle. 70% on understanding what a QuickStart is and how it works, and 30% of the time articulating and enabling them to be used as a selling tool"
  # content_reviewer_email and infra_reviewer_email are assigned by the RHDP team — not set by the author
  jira_ticket: "RHDPCD-858"
  workflow_id: "0cf1f398-b9a0-4c2b-b954-fdde5d00a9a6"

spec:
  title: "Selling with Red Hat QuickStarts: A Hands-On Tour for Solution Architects"
  learning_objectives:
    - "Explore the Red Hat QuickStarts catalog and identify how QuickStarts accelerate customer proofs-of-concept"
    - "Deploy the Secure Agent Workspace QuickStart to provision a governed, secure environment for AI agents on OpenShift"
    - "Configure the security and governance controls (RBAC, network policy) built into the Secure Agent Workspace QuickStart"
    - "Deploy the Private AI Coding Assistant QuickStart in an air-gapped OpenShift environment"
    - "Demonstrate the Private AI Coding Assistant's air-gapped, in-cluster AI-assisted development workflow to a customer audience"
    - "Analyze the broader QuickStart family to match customer use cases to the right QuickStart in a sales conversation"
  modules:              # [{id, title, duration_min}] — id is stable (e.g. module-01)
    - id: module-01
      title: "Selling with Red Hat QuickStarts: What Is a QuickStart?"
      duration_min: 10
      status: not_started
    - id: module-02
      title: "Secure Agent Workspace — Deploy & Explore"
      duration_min: 20
      status: not_started
    - id: module-03
      title: "Secure Agent Workspace — Security & Governance Deep Dive"
      duration_min: 20
      status: not_started
    - id: module-04
      title: "Private AI Coding Assistant — Deploy"
      duration_min: 15
      status: not_started
    - id: module-05
      title: "Private AI Coding Assistant — Air-Gapped Dev Workflow"
      duration_min: 15
      status: not_started
    - id: module-06
      title: "QuickStart Family Recap & Next Steps"
      duration_min: 10
      status: not_started
  environment:
    platform: "ocp"               # ocp | rhel-vms — determines which sizing fields apply
    topology: "shared-cluster"               # shared-cluster | per-student | cnv-pool
    cloud_provider: cnv        # cnv | aws | troshka — cnv is default
    max_concurrent_users: 12 # required if topology = shared-cluster — per cluster; 6-8 clusters planned for the RH1 event

    # --- OCP-specific fields (only when platform = ocp) ---
    ocp_version: "4.21"                    # e.g. 4.20 — minimum 4.20; leave empty for rhel-vms
    cluster_type: "multinode"                   # sno | multinode — only for platform = ocp
    control_plane_instance_count: 3 # 1 if sno, 3 if multinode
    control_plane_cpu: 16            # 32 if sno, 16 if multinode
    control_plane_ram_gb: 64         # 128 if sno, 64 if multinode
    worker_count: 6                 # number of OCP worker nodes — estimate, TBD for infra review
    worker_cpu: 16                # vCPU per worker
    worker_ram_gb: 64                # RAM per worker in GB
    worker_disk_gb: 200                # disk per worker in GB

    # --- VM-specific fields (only when platform = rhel-vms) ---
    # Each entry: {role, count, cpu, ram_gb, disk_gb, os}
    vms_per_student: []

    # --- Common fields (both platforms) ---
    aap_version: ""                    # required if AAP in products
    ai_requirement: "maas"                 # maas | gpu | none
    ai_model_tier: "open-source"                 # open-source | frontier (if ai_requirement = maas or gpu)
    ai_model_name: ""                  # specific model e.g. granite-3.1-8b
    ai_justification: ""               # required if ai_model_tier = frontier or ai_requirement = gpu
    non_ga_products: []                # list of non-GA products/versions
    non_ga_access_plan: ""             # how access is provided for non-GA products
    external_services: ["github.com", "quay.io", "Red Hat Developer Playground MaaS"]              # named external service dependencies e.g. [github.com]
    gpu_nodes: 0                       # number of GPU nodes (0 = none)
    gpu_type: ""                       # e.g. NVIDIA A100 40GB (required if gpu_nodes > 0)
  duration_hours: 1.5
  audience: "intermediate"               # beginner | intermediate | advanced

compliance:
  last_hard_check: null
  hard_result: null

tracking:
  paused: false
  pause_reason: null

# Approval checklist — filled collaboratively by author + skill + system + reviewers
approval_checklist:

  content:
    prerequisites_verifiable: false
    assessment_strategy: "Trust-based — no automated solve/validate checks (classic Showroom lab). Participants complete each module's hands-on steps and can demo the resulting QuickStart deployments live."
    catalog_gap: ""
    design_overview: "This 90-minute lab equips intermediate Red Hat Solution Architects to sell OpenShift AI and related products using Red Hat QuickStarts. Participants learn what a QuickStart is, then deploy and explore two featured QuickStarts — Secure Agent Workspace (secure, governed AI agent environments) and Private AI Coding Assistant (air-gapped AI-assisted development) — before touring the broader QuickStart family and leaving with concrete next steps for customer engagements."
    module_summaries:
      - title: "Selling with Red Hat QuickStarts: What Is a QuickStart?"
        overview: "Presentation-style introduction to what a Red Hat QuickStart is and how it accelerates customer proofs-of-concept, previewing the two QuickStarts covered hands-on later in the lab."
      - title: "Secure Agent Workspace — Deploy & Explore"
        overview: "Participants deploy the Secure Agent Workspace QuickStart onto their OpenShift cluster and explore the resulting environment."
      - title: "Secure Agent Workspace — Security & Governance Deep Dive"
        overview: "Participants inspect and configure the RBAC and network policy controls the QuickStart provisions, building a security and governance narrative for customer demos."
      - title: "Private AI Coding Assistant — Deploy"
        overview: "Participants deploy the Private AI Coding Assistant QuickStart in an air-gapped OpenShift configuration."
      - title: "Private AI Coding Assistant — Air-Gapped Dev Workflow"
        overview: "Participants use the deployed assistant to complete an AI-assisted coding task entirely within the air-gapped environment, preparing a customer-facing demo narrative."
      - title: "QuickStart Family Recap & Next Steps"
        overview: "A tour of the broader QuickStart family (name, description, use case, value prop, links) plus a call to action for using QuickStarts in customer engagements."
    rcars_overlap_pct: 46
    rcars_top_matches:
      - title: "Private Model as a Service - A Practical Guide to Red Hat AI"
        ci_name: "published.private-maas-v3.prod"
        url: "https://catalog.demo.redhat.com/catalog?item=published.private-maas-v3.prod"
        relevance_score: 46
        why_it_fits: "Covers Red Hat OpenShift AI and OpenShift with hands-on AI-assisted coding and agentic AI workflows, but does not address the QuickStarts catalog, the specific QuickStart deployments, or sales positioning of the QuickStart family."
      - title: "Parasol Insurance AI Workshop on ARO - MOBB"
        ci_name: "azure-gpte.ocp-rhoai-aro-parasol-mobb.prod"
        url: "https://catalog.demo.redhat.com/catalog?item=azure-gpte.ocp-rhoai-aro-parasol-mobb.prod"
        relevance_score: 41
        why_it_fits: "Covers Red Hat OpenShift AI and OpenShift hands-on, but focuses on LLM workflows, computer vision, and GitOps for an insurance scenario rather than the Secure Agent Workspace or Private AI Coding Assistant QuickStarts."
      - title: "Taking MCP Servers to Production on OpenShift AI with the Red Hat MCP Registry"
        ci_name: "published.openshift-mcp-lab.prod"
        url: "https://catalog.demo.redhat.com/catalog?item=published.openshift-mcp-lab.prod"
        relevance_score: 39
        why_it_fits: "Covers OpenShift AI and AI agent governance/security controls on OpenShift, thematically adjacent to Secure Agent Workspace, but focused on MCP server deployment and registry governance rather than the QuickStart catalog or sales positioning."
    catalog_gap: "No existing catalog item covers the Red Hat QuickStarts catalog itself, the Secure Agent Workspace or Private AI Coding Assistant QuickStarts specifically, air-gapped AI-assisted development, or positioning the QuickStart family for customer sales conversations. The closest matches only partially overlap on underlying OpenShift AI/agentic-AI themes."
    rejections: []

  infra:
    peak_environments: null
    cost_per_run_est: ""
    provisioning_time_est: ""
    agnosticv_base_ci: ""
    approved_by: ""
    rejections: []

showroom_content_status: not_started
