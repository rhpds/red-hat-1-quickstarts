# Automation Manifest
# Describes what the lab/demo environment needs pre-configured.
# Generated by the automation agent from content analysis, or provided directly.
# Review and approve this before automation code is written.
#
# See the automation manifest format guide for field reference.
# DRAFT — generated during intake from spec.yaml + design.md. The automation
# procedure will refine this during the development stage.

approach: gitops

infrastructure:
  type: sandbox-tenant
  ocp_version: "4.21"
  multi_user: true
  users_per_deployment: 12

operators:
  - name: Red Hat OpenShift AI
    channel: "TBD"
    namespace: "TBD"
    reason: "Environment must have Red Hat OpenShift AI 3.5 pre-installed; learners use it but do not install it themselves"
    source_module: module-01-what-is-a-quickstart

applications: []
# The three featured QuickStarts (AI Quickstart RAG, IT Self Service, PPE Compliance Monitor)
# must be PRE-DEPLOYED into each tenant namespace ahead of the session — learners only USE
# them in Modules 2-4, they do not deploy anything. Author is building this GitOps automation
# separately; repo/chart references below are placeholders pending that work.

rbac:
  - type: namespace
    name: "{{ user_namespace }}"
    reason: "Per-tenant sandbox namespace (Sandbox API Cluster/Tenant model) isolating each SA's pre-deployed QuickStarts"

seed_data:
  - type: git-repo
    name: ai-qs-rag
    url: "TBD"
    target: "{{ user_namespace }}"
    reason: "AI Quickstart RAG — must be pre-deployed and running before the session; learner only uses it in Module 2"
    source_module: module-02-rag-quickstart-selling-the-demo
  - type: git-repo
    name: ai-qs-it-self-service
    url: "TBD"
    target: "{{ user_namespace }}"
    reason: "AI Quickstart IT Self Service — must be pre-deployed and running before the session; learner only uses it in Module 3"
    source_module: module-03-it-self-service-quickstart-selling-the-demo
  - type: git-repo
    name: ai-qs-ppe-comp
    url: "TBD"
    target: "{{ user_namespace }}"
    reason: "AI Quickstart PPE Compliance Monitor — must be pre-deployed and running before the session; learner only uses it in Module 4"
    source_module: module-04-ppe-compliance-monitor-quickstart-selling-the-demo

broken_resources: []

provision_data:
  - key: quickstart_catalog_url
    value: "TBD"
    description: "Link to the Red Hat QuickStarts catalog shown in Module 1"

notes: |
  Lab flow changed to sales-enablement: learners USE three pre-deployed QuickStarts (AI
  Quickstart RAG, IT Self Service, PPE Compliance Monitor) rather than deploying them. All
  three must be up and running in each tenant namespace before the session starts.

  Author is building this GitOps automation separately (per-tenant pre-deploy of all three
  QuickStarts) — this manifest documents the requirement; repo/chart URLs above are
  placeholders pending that work.

  Module 5 is an optional stretch module (deploy a QuickStart end-to-end) — target QuickStart
  is still TBD, so no automation requirement is defined for it yet.

  All three QuickStarts are moving to production as of this revision — repo/chart references
  may change before development starts.
