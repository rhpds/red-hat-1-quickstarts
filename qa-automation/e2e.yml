---
# E2E — does the learner's happy path actually work on this seat?
#
# Served by the Showroom runner at /stream/qa/e2e and behind the Nookbag
# "E2E" button. This is deliberately separate from healthcheck.yml:
#
#   healthcheck  -> "is the environment correct?" (readiness gate)
#   e2e          -> "can a learner do the thing?" (functional smoke)
#
# Read-only: every call exercises an existing endpoint; nothing is created,
# sent or deleted.

- name: LB2142 AI Quickstarts tenant end-to-end smoke
  hosts: localhost
  connection: local
  gather_facts: false
  module_defaults:
    group/kubernetes.core.k8s:
      kubeconfig: "{{ k8s_kubeconfig | default(omit) }}"
  vars:
    tenant_guid: "{{ guid | default(lookup('env', 'GUID'), true) }}"
    user_data: >-
      {{
        (lookup('file', '/user_data/user_data.yml', errors='ignore') | default('', true) | from_yaml)
        or {}
      }}
    domain: >-
      {{ user_data.openshift_cluster_ingress_domain | default(lookup('env', 'DOMAIN'), true) }}
    tenant_user: "{{ user_data.user | default('user-' ~ tenant_guid) }}"
    rag_ns: "{{ tenant_user }}-rag"
    it_selfsvc_ns: "{{ tenant_user }}-it-selfsvc"
    # llama-stack answers the runner directly over its Service. Using uri
    # rather than k8s_exec keeps this independent of pods/exec RBAC (the
    # runner has none in its own namespace) and of k8s_exec's `command`
    # parameter, which is a string — not a list — in kubernetes.core 6.x.
    llama_stack_url: "http://llamastack.{{ rag_ns }}.svc.cluster.local:8321/v1"
  tasks:
    - name: List the models llama-stack serves
      ansible.builtin.uri:
        url: "{{ llama_stack_url }}/models"
        method: GET
        status_code: [200]
        timeout: 30
      register: model_list
      changed_when: false
      retries: 18
      delay: 10
      until: (model_list.json.data | default([]) | length) > 0
      failed_when: (model_list.json.data | default([]) | length) == 0

    - name: Pick the RAG answer model
      ansible.builtin.set_fact:
        rag_model: >-
          {{ (model_list.json.data | map(attribute='id') | list
              | select('search', 'llama-scout') | list
              | first) | default('', true) }}

    - name: The RAG answer model is registered
      ansible.builtin.assert:
        that:
          - rag_model | length > 0
        fail_msg: >-
          llama-stack serves {{ model_list.json.data | map(attribute='id') | join(', ') }}
          but no llama-scout model. Modules 2 and 3 answer with llama-scout-17b.
        quiet: true

    - name: Ask the RAG model a question and read the answer
      ansible.builtin.uri:
        url: "{{ llama_stack_url }}/chat/completions"
        method: POST
        body_format: json
        body:
          model: "{{ rag_model }}"
          messages:
            - role: user
              content: In one sentence, what is CloudSync?
          max_tokens: 80
        status_code: [200]
        timeout: 120
      register: rag_ask
      changed_when: false

    - name: The model returned a non-empty answer
      ansible.builtin.assert:
        that:
          - >-
            ((rag_ask.json.choices | default([]) | first).message.content
             | default('', true) | trim | length) > 0
        fail_msg: >-
          {{ rag_model }} answered with an empty message
          ({{ rag_ask.json | default('no output') | to_json | truncate(400) }}).
        quiet: true

    - name: OpenClaw redirects unauthenticated visitors to Keycloak
      ansible.builtin.uri:
        url: "https://user-{{ tenant_guid }}-default-notebook-ui.{{ domain }}/"
        method: GET
        status_code: [302, 303, 307]
        follow_redirects: none
        validate_certs: false
        timeout: 20
      register: openclaw_redirect
      changed_when: false

    - name: The Keycloak sign-in page serves
      ansible.builtin.uri:
        url: "{{ openclaw_redirect.location }}"
        method: GET
        status_code: [200]
        follow_redirects: all
        validate_certs: false
        timeout: 20
        return_content: true
      register: keycloak_page
      changed_when: false

    - name: The Keycloak page is a sign-in form
      ansible.builtin.assert:
        that:
          - keycloak_page.content | default('') | lower is search('sign in|keycloak')
        fail_msg: >-
          OpenClaw redirected to {{ openclaw_redirect.location | default('nowhere') }}
          but the page does not look like a Keycloak sign-in form.
        quiet: true

    - name: A pre-seeded Webmail inbox is readable
      ansible.builtin.uri:
        url: >-
          https://test-email-server-ui-{{ it_selfsvc_ns }}.{{ domain
          }}/api/messages/alice.johnson@company.com
        method: GET
        status_code: [200]
        validate_certs: false
        timeout: 20
        return_content: true
      register: webmail_inbox
      changed_when: false

    - name: The Webmail inbox contains messages
      ansible.builtin.assert:
        that:
          - webmail_inbox.content | default('') | trim not in ['', '[]', 'null']
        fail_msg: >-
          The seeded Webmail inbox for alice.johnson@company.com is empty.
          Module 4's send/receive demo will not work.
        quiet: true

    - name: End-to-end summary
      ansible.builtin.debug:
        msg:
          - "RAG answer ({{ rag_model }}): {{ (rag_ask.json.choices | default([]) | first).message.content | default('') }}"
          - "OpenClaw -> {{ openclaw_redirect.location | default('?') }}"
          - "Webmail inbox: {{ webmail_inbox.status }}"
